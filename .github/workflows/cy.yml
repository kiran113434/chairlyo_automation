name: Cypress Tests

on:
  schedule:
    # Nepal Time (NPT, UTC+5:45) has no direct cron equivalent since cron only
    # supports whole-minute offsets from UTC. 3:00 PM NPT = 09:15 UTC.
    - cron: '15 9 * * *'
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # If your app needs to be started first, uncomment and adjust:
          # start: npm start
          # wait-on: 'http://localhost:3000'

      - name: Upload screenshots (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: cypress/videos
